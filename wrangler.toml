# Driftgold: one Worker (API + static front end) and one Durable Object per match.
# Deploy: products/rehost/deploy.py products/tm-game   (local dev: wrangler dev)
name = "driftgold"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Match"]

[observability]
enabled = true
